<title>Balrog</title>
<style>
  :root {
    --bg: #121212; --surface: #1e1b18; --raised: #2a2622; --line: #3a342e;
    --text: #ece6df; --muted: #a59c92; --accent: #ff7a00; --on-accent: #000;
    --danger: #ff6b5e; --ok: #7bd88f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf7f3; --surface: #ffffff; --raised: #f1ebe4; --line: #ddd3c8;
      --text: #221d18; --muted: #6f655b; --accent: #b35600; --on-accent: #fff;
      --danger: #b3261e; --ok: #1f7a3a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  input, textarea, select {
    width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { min-height: 110px; resize: vertical; }
  label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 13px; }
  button {
    padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button.small { padding: 3px 8px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .muted { color: var(--muted); }
  .error { color: var(--danger); }
  .hidden { display: none !important; }

  #login { max-width: 380px; margin: 0 auto; padding: 12vh 20px 20px; }
  #login h1 { font-size: 34px; margin: 0 0 4px; font-weight: 500; }
  #login .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  #login .check input { width: auto; }
  #login button { width: 100%; margin-top: 18px; padding: 10px; }

  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header {
    display: flex; gap: 10px; align-items: center; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap;
  }
  header .brand { font-size: 20px; margin-right: 6px; }
  header #search { flex: 1 1 180px; max-width: 420px; }
  header #status { margin-left: auto; font-size: 13px; }
  main { display: grid; grid-template-columns: 200px minmax(260px, 1fr) minmax(320px, 440px); min-height: 0; }
  nav, #list, #detail { overflow-y: auto; min-height: 0; }
  nav { border-right: 1px solid var(--line); padding: 10px 8px; }
  nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 8px 4px; }
  nav .item {
    display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
    padding: 6px 8px; border: 1px solid transparent; background: none; border-radius: 6px;
  }
  nav .item span:first-child { overflow: hidden; text-overflow: ellipsis; }
  nav .item.active { background: var(--raised); border-color: var(--line); }
  nav .item.drop { border-color: var(--accent); }
  nav .count { color: var(--muted); font-size: 13px; }
  #list { border-right: 1px solid var(--line); }
  .row {
    display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:hover, .row.active { background: var(--surface); }
  .row .text { flex: 1; min-width: 0; }
  .row .title, .row .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--muted); font-size: 13px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  #detail { padding: 14px 16px 30px; }
  #detail h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .field { display: flex; gap: 6px; align-items: center; }
  .field input { flex: 1; }
  .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .code { font-size: 22px; letter-spacing: .08em; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-auto-rows: min-content; overflow-y: auto; }
    nav, #list, #detail { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
  }
  .logo { display: block; width: 76px; height: 76px; margin: 0 auto 10px; }
  header .logo { width: 28px; height: 28px; margin: 0; }
  .brand-wrap { display: flex; align-items: center; gap: 9px; margin-right: 6px; }
  .brand-wrap .brand { margin: 0; }
  #login .hero { text-align: center; }
  .download {
    display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 26px;
    padding: 11px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    color: var(--text); text-decoration: none; line-height: 1.25;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .download:hover { border-color: var(--accent); background: var(--raised); transform: translateY(-1px); }
  .download:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .download svg { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .download .what { text-align: left; font-weight: 600; }
  .download small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  a.btn {
    padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised);
    color: var(--text); text-decoration: none; white-space: nowrap;
  }
  a.btn:hover { border-color: var(--accent); }
  main.gen { grid-template-columns: 200px minmax(320px, 640px); }
  .gen-view { max-width: 600px; }
  .row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .result {
    display: flex; gap: 8px; align-items: center; margin-top: 18px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  }
  .result .mono { flex: 1; font-size: 18px; word-break: break-all; }
  .ok { color: var(--ok); }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .pepper-panel { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; background: var(--surface); }
  .pepper-row { display: flex; gap: 6px; align-items: center; padding: 4px 0; }
  .pepper-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  input[type=checkbox] { width: 16px; height: 16px; padding: 0; margin: 0; accent-color: var(--accent); flex: none; }
  .tickwrap { display: flex; align-items: center; align-self: stretch; margin: 0; padding: 0 4px 0 0; cursor: pointer; }
  .row.ticked { background: var(--raised); }
  .listbar {
    position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 7px 12px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .listbar label.all { display: flex; gap: 8px; align-items: center; margin: 0; color: var(--text); font-size: 14px; cursor: pointer; }
  .listbar .picked { font-weight: 600; }
  .listbar .spacer { flex: 1; }
  .bulkpanel {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .bulkpanel select, .bulkpanel input[type=text] { width: auto; min-width: 150px; flex: 1 1 150px; }
  .bulknote { padding: 6px 12px; margin: 0; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
</style>
</head>

    if (v < 0) throw new Error("Setup keys only contain the letters A–Z and the digits 2–7.");

 * and tries again — so nothing made elsewhere is overwritten.

async function commit(change) {

      version: 2, key: vault.file.key,
      records: vault.file.records.slice(), tombstones: vault.file.tombstones.slice(),

    const body = await encodeFile(file, vault.dek);

function removeItem(file, items, uid) {
  file.records = file.records.filter((r) => r.uid !== uid);
  file.tombstones = file.tombstones.filter((t) => t.uid !== uid).concat({ uid, deletedAt: Date.now() });
  items.delete(uid);
}

async function refresh() {
  if (!vault || view.draft) return; // never pull the rug from under an edit
  try {
    const response = await request("GET", vault.token);
    if (response.ok && (response.headers.get("X-Balrog-Revision") || "") !== vault.revision) {
      vault = { ...vault, ...(await loadFromServer(vault.token, vault.dek)) };
      setStatus("Updated " + new Date().toLocaleTimeString());
      render();
    }
  } catch (e) { setStatus(e.message, true); }
}

// ---- Lock / unlock ----------------------------------------------------------------

function lock(message) {
  vault = null;
  view = { type: "PASSWORD", folder: null, query: "", selected: null, draft: null, gen: newGen(), checked: new Set(), bulk: null };
  clearTimeout(lockTimer); clearInterval(refreshTimer); clearInterval(codeTimer);
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("nav").replaceChildren(); $("list").replaceChildren(); $("detail").replaceChildren();
  $("search").value = "";
  $("password").value = "";
  $("loginError").textContent = message || "";
  $("password").focus();
}

function touch() {
  if (!vault) return;
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => lock("Locked after 5 minutes without activity."), AUTO_LOCK_MS);
}

async function unlock() {
  const token = $("token").value.trim();
  const password = $("password").value;
  if (!token || !password) { $("loginError").textContent = "Enter the sync token and your master password."; return; }
  $("unlock").disabled = true;
  $("unlock").textContent = "Unlocking…";
  $("loginError").textContent = "";
  try {
    vault = await loadFromServer(token, null, password);
    try {
      if ($("remember").checked) localStorage.setItem("balrog.token", token);
      else localStorage.removeItem("balrog.token");
    } catch (e) { /* storage unavailable: just don't remember */ }
    $("password").value = "";
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    setStatus("In sync");
    refreshTimer = setInterval(refresh, REFRESH_MS);
    touch();
    render();
    $("search").focus();
  } catch (e) {
    vault = null;
    $("loginError").textContent = e.message;
  } finally {
    $("unlock").disabled = false;
    $("unlock").textContent = "Unlock";
  }
}

function setStatus(text, isError) {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "muted";
}

async function copy(what, value) {
  try {
    await navigator.clipboard.writeText(value);
    setStatus(what + " copied — clears in 30 s");
    clearTimeout(clipboardTimer);
    clipboardTimer = setTimeout(() => navigator.clipboard.writeText("").catch(() => {}), CLIPBOARD_CLEAR_MS);
  } catch (e) {
    setStatus("The browser blocked copying.", true);
  }
}

// ---- Rendering -------------------------------------------------------------------------

const typeOf = (uid) => vault.file.records.find((r) => r.uid === uid).type;

function entries(type) {
  return vault.file.records
    .filter((r) => r.type === type && vault.items.has(r.uid))
    .map((r) => ({ uid: r.uid, ...vault.items.get(r.uid) }))
    .sort((a, b) => (a.title || "").localeCompare(b.title || "", undefined, { sensitivity: "base" }));
}

function folders() {
  const names = new Set();
  for (const r of vault.file.records) {
    const item = vault.items.get(r.uid);
    if (item && r.type !== "PEPPER" && item.folder) names.add(item.folder);
  }
  return [...names].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
}

function visible() {
  const q = view.query.trim().toLowerCase();
  return entries(view.type).filter((e) =>
    (view.folder === null || (e.folder || "") === view.folder) &&
    (!q || [e.title, e.username, e.url].some((v) => (v || "").toLowerCase().includes(q))));
}

function render() {
  const generator = view.type === "GENERATOR";
  $("main").classList.toggle("gen", generator);
  $("list").classList.toggle("hidden", generator);
  renderNav();
  if (generator) { clearInterval(codeTimer); renderGenerator(); } else { renderList(); renderDetail(); }
}

function renderNav() {
  const typeButton = (type, label) => h("button", {
    class: "item" + (view.type === type ? " active" : ""),
    onclick: () => { view.type = type; view.selected = null; view.draft = null; clearBulk(); render(); },
  }, h("span", { text: label }), type === "GENERATOR" ? null : h("span", { class: "count", text: entries(type).length }));

  if (view.type === "GENERATOR") {
    $("nav").replaceChildren(
      h("h2", { text: "Show" }),
      typeButton("PASSWORD", "Passwords"), typeButton("NOTE", "Notes"), typeButton("GENERATOR", "Generator"));
    return;
  }

  const all = entries(view.type);
  const count = (folder) => all.filter((e) => folder === null || (e.folder || "") === folder).length;
  const names = folders();
  if (view.folder && !names.includes(view.folder)) view.folder = null;

  const folderButton = (folder, label) => {
    const el = h("button", {
      class: "item" + (view.folder === folder ? " active" : ""),
      onclick: () => { view.folder = folder; clearBulk(); render(); },
    }, h("span", { text: label }), h("span", { class: "count", text: count(folder) }));
    if (folder !== null) {
      // Drop an entry here to file it under this folder.
      el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("drop"); });
      el.addEventListener("dragleave", () => el.classList.remove("drop"));
      el.addEventListener("drop", (e) => {
        e.preventDefault(); el.classList.remove("drop");
        const uid = e.dataTransfer.getData("text/plain");
        if (vault.items.has(uid)) moveToFolder([uid], folder);
      });
    }
    return el;
  };

  $("nav").replaceChildren(
    h("h2", { text: "Show" }),
    typeButton("PASSWORD", "Passwords"), typeButton("NOTE", "Notes"), typeButton("GENERATOR", "Generator"),
    h("h2", { text: "Folders" }),
    folderButton(null, "All"),
    ...names.map((n) => folderButton(n, n)),
    folderButton("", "No folder"),
    h("div", { style: "padding:10px 8px" },
      h("button", { class: "small", onclick: newFolder }, "+ New folder"),
      view.folder ? h("button", { class: "small", style: "margin-left:6px", onclick: renameFolder }, "Rename") : null,
      h("p", { class: "muted", style: "font-size:12px" }, "Drag an entry onto a folder to move it.")));
}

// ---- Ticking entries and acting on many at once -----------------------------------------
// The selection (view.checked) only ever holds entries that are currently shown, and is
// dropped whenever the folder, search or kind of entry changes, so an action can never
// touch something the user cannot see. Each action is ONE vault save, so sync is not hit
// once per entry.

const entriesWord = (n) => n + (n === 1 ? " entry" : " entries");

function clearBulk() { view.checked.clear(); view.bulk = null; }

/** Forget ticked entries that are gone or no longer shown (e.g. changed on another device). */
function pruneChecked(shown) {
  const visibleUids = new Set(shown.map((e) => e.uid));
  for (const uid of [...view.checked]) {
    // Peppers are never listed here; they are only kept so that a selection which
    // contains one is handled correctly (Delete works, Move and Copy refuse).
    const pepper = vault.items.has(uid) && typeOf(uid) === "PEPPER";
    if (!vault.items.has(uid) || (!visibleUids.has(uid) && !pepper)) view.checked.delete(uid);
  }
  if (!view.checked.size) view.bulk = null;
}

function renderList() {
  const shown = visible();
  pruneChecked(shown);
  const rows = shown.map((e) => {
    const buttons = [];
    if (view.type === "PASSWORD") {
      if (e.totp) buttons.push(h("button", { class: "small", title: "Copy two-factor code", onclick: async (ev) => {
        ev.stopPropagation();
        try { copy("Code", await totpCode(parseTotp(e.totp), Date.now())); } catch (err) { setStatus(err.message, true); }
      } }, "2FA"));
      if (e.username) buttons.push(h("button", { class: "small", title: "Copy username", onclick: (ev) => { ev.stopPropagation(); copy("Username", e.username); } }, "User"));
      buttons.push(h("button", { class: "small", title: "Copy password", onclick: (ev) => { ev.stopPropagation(); copy("Password", e.password || ""); } }, "Pass"));
    }
    const tick = h("input", { type: "checkbox", "aria-label": "Select " + (e.title || "(untitled)") });
    tick.checked = view.checked.has(e.uid);
    tick.addEventListener("change", () => {
      if (tick.checked) view.checked.add(e.uid); else view.checked.delete(e.uid);
      if (!view.checked.size) view.bulk = null;
      renderList();
    });
    return h("div", {
      class: "row" + (view.selected === e.uid ? " active" : "") + (view.checked.has(e.uid) ? " ticked" : ""), draggable: "true",
      ondragstart: (ev) => ev.dataTransfer.setData("text/plain", e.uid),
      onclick: () => select(e.uid),
    },
    // Ticking is separate from opening: clicks on the box never reach the row.
    h("label", { class: "tickwrap", onclick: (ev) => ev.stopPropagation() }, tick),
    h("div", { class: "text" },
      h("div", { class: "title", text: e.title || "(untitled)" }),
      h("div", { class: "sub", text: view.type === "PASSWORD" ? (e.username || "") : (e.folder || "") })),
    ...buttons);
  });
  $("list").replaceChildren(...bulkHeader(shown),
    ...(rows.length ? rows : [h("div", { class: "empty", text: view.query ? "Nothing matches." : "Nothing here yet." })]));
}

/** The select-all bar, the action bar once something is ticked, and the folder chooser. */
function bulkHeader(shown) {
  if (!shown.length && !view.checked.size) return [];
  const ticked = shown.filter((e) => view.checked.has(e.uid)).length;
  const all = h("input", { type: "checkbox", id: "tickAll", disabled: !shown.length, "aria-label": "Select all shown entries" });
  all.checked = shown.length > 0 && ticked === shown.length;
  all.indeterminate = ticked > 0 && ticked < shown.length;
  all.addEventListener("change", () => {
    for (const e of shown) { if (all.checked) view.checked.add(e.uid); else view.checked.delete(e.uid); }
    if (!view.checked.size) view.bulk = null;
    renderList();
  });
  const n = view.checked.size;
  const hasPepper = [...view.checked].some((uid) => typeOf(uid) === "PEPPER");
  const bar = h("div", { class: "listbar", id: "listbar" },
    h("label", { class: "all" }, all, "Select all (" + shown.length + ")"),
    n ? h("span", { class: "picked", role: "status", text: n + " selected" }) : null,
    n ? h("button", { class: "small", id: "bulkClear", onclick: () => { clearBulk(); renderList(); } }, "Clear") : null,
    n ? h("span", { class: "spacer" }) : null,
    n ? h("button", { class: "small", id: "bulkMove", disabled: hasPepper, onclick: () => { view.bulk = { mode: "move" }; renderList(); } }, "Move to folder…") : null,
    n ? h("button", { class: "small", id: "bulkCopy", disabled: hasPepper, onclick: () => { view.bulk = { mode: "copy" }; renderList(); } }, "Copy to folder…") : null,
    n ? h("button", { class: "small danger", id: "bulkDelete", onclick: bulkDelete }, "Delete") : null);
  const out = [bar];
  if (n && hasPepper) {
    out.push(h("p", { class: "bulknote", id: "bulkPepperNote", text:
      "The selection includes a Pepper. Peppers can't be filed in folders, so Move and Copy are off; Delete still works." }));
  } else if (n && view.bulk) {
    out.push(bulkPanel(view.bulk.mode));
  }
  return out;
}

function bulkPanel(mode) {
  const n = view.checked.size;
  const names = folders();
  const choices = [""].concat(names);                     // "" is "No folder"
  const select = h("select", { id: "bulkFolder", "aria-label": "Folder" },
    h("option", { value: "0" }, "No folder"),
    ...names.map((name, i) => h("option", { value: String(i + 1) }, name)),
    h("option", { value: "new" }, "New folder…"));
  const name = h("input", { type: "text", id: "bulkNewName", placeholder: "New folder name", autocomplete: "off", spellcheck: "false" });
  const sync = () => name.classList.toggle("hidden", select.value !== "new");
  select.addEventListener("change", sync);
  select.value = names.length ? "1" : "new";
  sync();
  const go = h("button", { class: "primary", id: "bulkGo", onclick: () => {
    let folder = select.value === "new" ? name.value.trim() : choices[Number(select.value)];
    if (select.value === "new" && !folder) { setStatus("Type a name for the new folder.", true); name.focus(); return; }
    if (mode === "move") bulkMove(folder); else bulkCopy(folder);
  } }, (mode === "move" ? "Move " : "Copy ") + entriesWord(n));
  setTimeout(() => select.focus(), 0);
  return h("div", { class: "bulkpanel", id: "bulkPanel" },
    h("span", { text: (mode === "move" ? "Move to:" : "Copy to:") }), select, name, go,
    h("button", { onclick: () => { view.bulk = null; renderList(); } }, "Cancel"));
}

async function bulkMove(folder) {
  const uids = [...view.checked];
  const changing = uids.filter((uid) => (vault.items.get(uid).folder || "") !== folder).length;
  view.bulk = null;
  if (!changing) { setStatus("They are already in " + (folder || "No folder") + "."); renderList(); return; }
  setStatus("Moving…");
  if (await moveToFolder(uids, folder)) {
    clearBulk(); render();
    setStatus("Moved " + entriesWord(changing) + " to " + (folder || "No folder") + ".");
  }
}

/** Duplicates each ticked entry into [folder]: new id, same content and kind; originals stay. */
async function bulkCopy(folder) {
  const uids = [...view.checked];
  view.bulk = null;
  let made = 0;
  setStatus("Copying…");
  try {
    await commit(async (file, items) => {
      made = 0;
      for (const uid of uids) {
        const item = items.get(uid);
        const record = file.records.find((r) => r.uid === uid);
        if (item && record && record.type !== "PEPPER") {
          await putItem(file, items, newUid(), record.type, { ...item, folder });
          made++;
        }
      }
    });
    clearBulk(); render();
    setStatus("Copied " + entriesWord(made) + " to " + (folder || "No folder") + "; the originals are kept.");
  } catch (e) { setStatus(e.message, true); renderList(); }
}

async function bulkDelete() {
  const uids = [...view.checked];
  const n = uids.length;
  const peppers = uids.filter((uid) => typeOf(uid) === "PEPPER").length;
  const text = "Delete " + entriesWord(n) + "? " +
    (peppers ? "This includes " + peppers + (peppers === 1 ? " Pepper" : " Peppers") + ": passwords made with a Pepper cannot be recreated without it. " : "") +
    "They will be deleted on your phone too.";
  if (!confirm(text)) return;
  setStatus("Deleting…");
  try {
    await commit(async (file, items) => {
      for (const uid of uids) if (items.has(uid)) removeItem(file, items, uid);
    });
    if (uids.includes(view.selected)) view.selected = null;
    if (view.draft && uids.includes(view.draft.uid)) view.draft = null;
    clearBulk(); render();
    setStatus("Deleted " + entriesWord(n) + ".");
  } catch (e) { setStatus(e.message, true); renderList(); }
}

function select(uid) {
  view.selected = uid;
  view.draft = null;
  render();
}

function startNew(type) {
  view.type = type;
  clearBulk();
  view.selected = null;
  view.draft = type === "PASSWORD"
    ? { uid: null, type, title: "", username: "", password: "", url: "", notes: "", totp: "", folder: view.folder || "" }
    : { uid: null, type, title: "", body: "", folder: view.folder || "" };
  render();
}

function renderDetail() {
  clearInterval(codeTimer);
  const detail = $("detail");
  let item = view.draft;
  if (!item && view.selected && vault.items.has(view.selected)) {
    item = { uid: view.selected, type: typeOf(view.selected), ...vault.items.get(view.selected) };
  }
  if (!item) { detail.replaceChildren(h("div", { class: "empty", text: "Select an entry, or add one." })); return; }

  const isPassword = item.type === "PASSWORD";
  const input = (value, attrs) => h("input", { value: value || "", autocomplete: "off", spellcheck: "false", ...attrs });
  const title = input(item.title);
  const folder = input(item.folder, { list: "folderNames", placeholder: "None" });
  const error = h("p", { class: "error", role: "alert" });
  const fields = [h("label", {}, "Title"), title];
  let read;

  if (isPassword) {
    const username = input(item.username);
    const password = input(item.password, { type: "password", class: "mono" });
    const url = input(item.url, { inputmode: "url" });
    const totp = input(item.totp ? parseTotpSafe(item.totp).secret : "", { class: "mono", placeholder: "Setup key or otpauth:// link" });
    const notes = h("textarea", {}); notes.value = item.notes || "";
    const code = h("span", { class: "mono code" });
    const codeRow = h("div", { class: "field", style: "margin-top:6px" }, code,
      h("button", { class: "small", onclick: () => copy("Code", code.dataset.value || "") }, "Copy"));
    const showCode = async () => {
      try {
        const c = parseTotp(totp.value);
        const now = Date.now();
        code.dataset.value = await totpCode(c, now);
        code.textContent = code.dataset.value + "  (" + (c.period - Math.floor(now / 1000) % c.period) + " s)";
        codeRow.classList.remove("hidden");
      } catch (e) { codeRow.classList.add("hidden"); }
    };
    totp.addEventListener("input", showCode);
    showCode();
    codeTimer = setInterval(showCode, 1000);

    fields.push(
      h("label", {}, "Username / email"),
      h("div", { class: "field" }, username, h("button", { class: "small", onclick: () => copy("Username", username.value) }, "Copy")),
      h("label", {}, "Password"),
      h("div", { class: "field" }, password,
        h("button", { class: "small", onclick: (ev) => {
          password.type = password.type === "password" ? "text" : "password";
          ev.target.textContent = password.type === "password" ? "Show" : "Hide";
        } }, "Show"),
        h("button", { class: "small", onclick: () => copy("Password", password.value) }, "Copy")),
      h("label", {}, "Website"), url,
      h("label", {}, "Two-factor setup key"), totp, codeRow,
      h("label", {}, "Folder"), folder,
      h("label", {}, "Notes"), notes);
    read = () => {
      const next = { ...stripMeta(item), title: title.value, username: username.value, password: password.value,
        url: url.value, notes: notes.value, folder: folder.value.trim() };
      // A changed password no longer comes from its saved recipe.
      if (next.recipe && password.value !== item.password) next.recipe = "";
      const key = totp.value.trim();
      if (!key) next.totp = "";
      else if (!item.totp || parseTotpSafe(item.totp).secret !== key.toUpperCase().replace(/[\s=-]/g, "")) {
        next.totp = totpToUri(parseTotp(key)); // throws with a readable message
      }
      return next;
    };
  } else {
    const body = h("textarea", { style: "min-height:260px" }); body.value = item.body || "";
    fields.push(h("label", {}, "Note"), body, h("label", {}, "Folder"), folder);
    read = () => ({ ...stripMeta(item), title: title.value, body: body.value, folder: folder.value.trim() });
  }

  const save = h("button", { class: "primary", onclick: async () => {
    let next;
    try { next = read(); } catch (e) { error.textContent = e.message; return; }
    const uid = item.uid || newUid();
    save.disabled = true;
    try {
      await commit((file, items) => putItem(file, items, uid, item.type, next));
      view.draft = null; view.selected = uid;
      render();
    } catch (e) { error.textContent = e.message; setStatus(e.message, true); save.disabled = false; }
  } }, "Save");

  const remove = item.uid ? h("button", { class: "danger", onclick: async () => {
    if (!confirm('Delete "' + (item.title || "(untitled)") + '"? It will be deleted on your phone too.')) return;
    try {
      await commit((file, items) => removeItem(file, items, item.uid));
      view.selected = null;
      render();
    } catch (e) { error.textContent = e.message; setStatus(e.message, true); }
  } }, "Delete") : null;

  detail.replaceChildren(
    h("h2", { text: item.uid ? (isPassword ? "Password" : "Note") : (isPassword ? "New password" : "New note") }),
    h("datalist", { id: "folderNames" }, ...folders().map((n) => h("option", { value: n }))),
    ...fields,
    h("div", { class: "actions" }, save,
      h("button", { onclick: () => { view.draft = null; if (!item.uid) view.selected = null; render(); } }, item.uid ? "Revert" : "Cancel"),
      remove),
    error);
  // Editing an existing entry counts as a draft too, so a background refresh
  // does not replace what is being typed.
  detail.oninput = () => { if (!view.draft) view.draft = item; };
  if (!item.uid) title.focus();
}

const stripMeta = ({ uid, type, ...rest }) => rest;
function parseTotpSafe(value) { try { return parseTotp(value); } catch (e) { return { secret: "" }; } }

async function moveToFolder(uids, folder) {
  let ok = true;
  try {
    await commit(async (file, items) => {
      for (const uid of uids) {
        const item = items.get(uid);
        const record = file.records.find((r) => r.uid === uid);
        if (item && record && (item.folder || "") !== folder) {
          await putItem(file, items, uid, record.type, { ...item, folder });
        }
      }
    });
  } catch (e) { setStatus(e.message, true); ok = false; }
  render();
  return ok;
}

function newFolder() {
  const name = (prompt("Name of the new folder. It appears once an entry is in it — the selected entry is moved there now.") || "").trim();
  if (!name) return;
  if (view.selected) moveToFolder([view.selected], name).then(() => { view.folder = name; clearBulk(); render(); });
  else setStatus("Select an entry first, then create the folder for it.", true);
}

function renameFolder() {
  const old = view.folder;
  const name = prompt('Rename folder "' + old + '" (leave empty to remove the folder and keep its entries):', old);
  if (name === null || name.trim() === old) return;
  const uids = vault.file.records
    .filter((r) => r.type !== "PEPPER" && vault.items.has(r.uid) && (vault.items.get(r.uid).folder || "") === old)
    .map((r) => r.uid);
  moveToFolder(uids, name.trim()).then(() => { view.folder = name.trim() || null; clearBulk(); render(); });
}

// ---- Deterministic generator -------------------------------------------------------
// A port of DeterministicGenerator.kt, which is itself a port of the standalone
// Generator app. The output must stay identical to theirs, character for character:
// do NOT change the algorithm. Reference: Base "Roberto", Case "Joaquin", Salt
// "Perez-Franco", no Pepper, Trim 10 gives mpyz\XK-%G (ANC), orxycYT73Q (AN) and
// prxyeaWGDV (A).

const DET_TYPES = [
  { key: "ANC", label: "Letters, numbers and special", pool: 94 },
  { key: "AN", label: "Letters and numbers", pool: 62 },
  { key: "A", label: "Letters only", pool: 52 },
];
const detType = (key) => DET_TYPES.find((t) => t.key === key) || DET_TYPES[0];

async function detPassword(base, kase, salt, pepper, trim, typeKey) {
  const pool = detType(typeKey).pool;
  if (!(trim >= 1 && trim <= pool)) throw new Error("Trim must be between 1 and " + pool);
  const baseCase = "My base is " + base + "." + (kase ? " My case is " + kase + "." : " I use no case.");
  const saltCombined = salt + pepper;
  const fullSalt = (saltCombined ? "My salt 1 is " + saltCombined + "." : "I use no salt 1.") + " My trim is " + trim + ".";
  // As in the Android app: the password is hashed as UTF-8, the salt as US-ASCII,
  // where every character outside ASCII becomes '?'.
  const saltBytes = Uint8Array.from(Array.from(fullSalt, (ch) => (ch.codePointAt(0) < 128 ? ch.codePointAt(0) : 63)));
  const key = await crypto.subtle.importKey("raw", enc.encode(baseCase), "PBKDF2", false, ["deriveBits"]);
  const derived = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: saltBytes, iterations: 100000 }, key, 200 * 8));
  const text = b64(derived);
  const numbers = [];
  for (let i = 0; i < pool; i++) {
    let digits = "";
    for (let n = 0; n < 5; n++) digits += text.charCodeAt(2 * i + n);
    numbers.push(Number(digits));
  }
  // Array.prototype.sort is stable, like Kotlin's sortedBy: ties keep their order.
  const order = numbers.map((_, i) => i).sort((a, b) => numbers[a] - numbers[b]);
  const ranks = new Array(pool);
  order.forEach((original, position) => { ranks[original] = position; });
  let out = "";
  for (let i = 0; i < trim; i++) {
    const r = ranks[i];
    let c;
    if (typeKey === "AN") c = r < 10 ? r + 48 : (r > 35 ? r + 61 : r + 55);
    else if (typeKey === "A") c = r > 25 ? r + 71 : r + 65;
    else c = 33 + r;
    out += String.fromCharCode(c);
  }
  return out;
}

/** "m...G": first and last UTF-16 unit, as the app writes it. */
const detHint = (value) => (value ? value[0] + "..." + value[value.length - 1] : null);

function detRecipeText(r) {
  return "Base: " + r.base + "\nCase: " + r.kase + "\nSalt: " + r.salt + "\nTrim: " + r.trim +
    "\nType: " + r.type + (r.pepperHint ? "\nPepper: " + r.pepperHint : "") + (r.sane ? "\nSane: " + r.sane : "");
}

/** Reads recipe text (the app's Recipe.parse): null if it has none of the expected lines. */
function detParseRecipe(text) {
  const data = {};
  for (const line of text.split("\n")) {
    const l = line.replace(/\r$/, "");
    const at = l.indexOf(": ");
    if (at >= 0) data[l.slice(0, at).trim()] = l.slice(at + 2).trim();
  }
  if (!["Base", "Salt", "Trim", "Type"].some((k) => k in data)) return null;
  const hint = (v) => {
    if (v == null) return null;
    const parts = v.split("...");
    return parts.length === 2 && parts[0] && parts[1] ? parts[0][0] + "..." + parts[1][0] : null;
  };
  return {
    base: data.Base || "", kase: data.Case || "", salt: data.Salt || "",
    trim: "Trim" in data && /^[+-]?\d+$/.test(data.Trim) ? parseInt(data.Trim, 10) : null,
    type: DET_TYPES.some((t) => t.key === data.Type) ? data.Type : null,
    pepperHint: hint(data.Pepper), sane: hint(data.Sane),
  };
}

function newGen() {
  return { base: "", kase: "", salt: "", trim: "", type: "ANC", pepperUid: "",
    expectedSane: null, expectedPepper: null, password: "", recipe: "", checksOut: null,
    revealed: false, msg: "", msgError: false, busy: false, showPaste: false, managePeppers: false };
}

/** Stored Peppers, ordered like the app: digits and letters first, other characters after. */
function peppers() {
  const rank = (p) => {
    const first = (p.value || "")[0];
    if (first === undefined) return Infinity;
    return /[\p{L}\p{N}]/u.test(first) ? first.codePointAt(0) : first.codePointAt(0) + 0x110000;
  };
  return vault.file.records
    .filter((r) => r.type === "PEPPER" && vault.items.has(r.uid))
    .map((r) => ({ uid: r.uid, ...vault.items.get(r.uid) }))
    .sort((a, b) => rank(a) - rank(b));
}
const pepperLabel = (p) => (detHint(p.value) ? detHint(p.value) + " - " : "") + (p.title || "");

function genSay(text, isError) {
  view.gen.msg = text; view.gen.msgError = !!isError;
  renderGenerator();
}

function genApplyRecipe(text, source) {
  const g = view.gen;
  const r = detParseRecipe(text);
  if (!r) { genSay("That is not a generator recipe.", true); return false; }
  g.base = r.base; g.kase = r.kase; g.salt = r.salt;
  if (r.trim != null) g.trim = String(r.trim);
  if (r.type) g.type = r.type;
  g.expectedSane = r.sane; g.expectedPepper = r.pepperHint;
  g.password = ""; g.recipe = ""; g.checksOut = null;
  // Pick the Pepper for them when exactly one fits the recipe's hint.
  const fits = r.pepperHint ? peppers().filter((p) => detHint(p.value) === r.pepperHint) : [];
  g.pepperUid = fits.length === 1 ? fits[0].uid : "";
  g.showPaste = false;
  genSay(!r.pepperHint ? "Recipe " + source + "."
    : fits.length === 1 ? "Recipe " + source + '. Pepper "' + fits[0].title + '" selected.'
    : "Recipe " + source + ". Select the Pepper " + r.pepperHint + " before generating.");
  return true;
}

async function genGenerate() {
  const g = view.gen;
  g.base = g.base.trim(); g.kase = g.kase.trim(); g.salt = g.salt.trim();
  const type = detType(g.type);
  let trim = parseInt(g.trim, 10);
  if (!g.base || !g.salt || !(trim > 0)) { genSay("Base, Salt and Trim are required.", true); return; }
  if (trim > type.pool) trim = type.pool;
  g.trim = String(trim);
  const pepper = peppers().find((p) => p.uid === g.pepperUid) || null;
  const pepperHint = pepper ? detHint(pepper.value) : null;
  if (g.expectedPepper && !pepper) {
    genSay("This recipe expects the Pepper " + g.expectedPepper + ". Select it before generating.", true); return;
  }
  if (g.expectedPepper && pepperHint !== g.expectedPepper) {
    genSay('Pepper "' + pepper.title + '" (' + pepperHint + ") is not the one this recipe expects (" + g.expectedPepper + ").", true); return;
  }
  // The previous result goes at once, so it can't be copied or turned into a QR code
  // while a new one is being worked out.
  g.password = ""; g.recipe = ""; g.checksOut = null; g.revealed = false;
  g.busy = true; g.msg = ""; renderGenerator();
  try {
    const password = await detPassword(g.base, g.kase, g.salt, pepper ? pepper.value : "", trim, g.type);
    const sane = detHint(password);
    g.password = password; g.revealed = false;
    g.checksOut = g.expectedSane ? g.expectedSane === sane : null;
    // A snapshot of what actually produced this password.
    g.recipe = detRecipeText({ base: g.base, kase: g.kase, salt: g.salt, trim, type: g.type, pepperHint, sane });
  } catch (e) {
    g.msg = e.message; g.msgError = true;
  }
  g.busy = false;
  renderGenerator();
}

async function pepperAction(change) {
  try { await change(); } catch (e) { setStatus(e.message, true); view.gen.msg = e.message; view.gen.msgError = true; }
  renderGenerator();
}

function renderGenerator() {
  if (!vault || view.type !== "GENERATOR") return;
  const g = view.gen;
  const list = peppers();
  if (!list.some((p) => p.uid === g.pepperUid)) g.pepperUid = "";

  const bind = (key, el, filter) => {
    el.addEventListener("input", () => { if (filter) el.value = filter(el.value); g[key] = el.value; });
    return el;
  };
  const textInput = (key) => bind(key, h("input", { value: g[key], autocomplete: "off", spellcheck: "false", autocapitalize: "off", autocorrect: "off" }));
  const trim = bind("trim", h("input", { value: g.trim, inputmode: "numeric", autocomplete: "off", maxlength: "2" }), (v) => v.replace(/\D/g, "").slice(0, 2));
  const typeSelect = h("select", { onchange: (e) => { g.type = e.target.value; renderGenerator(); } },
    ...DET_TYPES.map((t) => h("option", { value: t.key, selected: g.type === t.key }, t.label)));
  const pepperSelect = h("select", { onchange: (e) => { g.pepperUid = e.target.value; } },
    h("option", { value: "" }, "(No Pepper)"),
    ...list.map((p) => h("option", { value: p.uid, selected: p.uid === g.pepperUid }, pepperLabel(p))));
  const max = detType(g.type).pool;

  const paste = h("textarea", { placeholder: "Paste a recipe here" });
  const pasteArea = g.showPaste ? h("div", {},
    h("p", { class: "note" }, "Your browser did not allow reading the clipboard. Paste the recipe here instead."),
    paste, h("div", { class: "row2" }, h("button", { onclick: () => genApplyRecipe(paste.value, "pasted") }, "Load recipe"))) : null;

  const pepperPanel = !g.managePeppers ? null : (() => {
    const name = h("input", { autocomplete: "off", placeholder: "Name" });
    const value = h("input", { type: "password", autocomplete: "off", placeholder: "Value" });
    return h("div", { class: "pepper-panel" },
      h("strong", {}, "Peppers"),
      ...(list.length ? list : []).map((p) => h("div", { class: "pepper-row" },
        h("span", { text: pepperLabel(p) }),
        h("button", { class: "small", onclick: () => {
          const next = (prompt("New name for this Pepper:", p.title) || "").trim();
          if (!next || next === p.title) return;
          if (list.some((o) => o.uid !== p.uid && (o.title || "").toLowerCase() === next.toLowerCase())) { genSay("A Pepper with that name already exists.", true); return; }
          pepperAction(() => commit((file, items) => putItem(file, items, p.uid, "PEPPER", { ...items.get(p.uid), title: next })));
        } }, "Rename"),
        h("button", { class: "small danger", onclick: () => {
          if (!confirm('Delete the Pepper "' + p.title + '"? Passwords made with it cannot be recreated without it. It is deleted on your phone too.')) return;
          pepperAction(() => commit((file, items) => removeItem(file, items, p.uid)));
        } }, "Delete"))),
      list.length ? null : h("p", { class: "muted" }, "No Peppers stored."),
      h("label", {}, "Add a Pepper"), name, h("div", { style: "height:6px" }), value,
      h("div", { class: "row2" }, h("button", { onclick: () => {
        const title = name.value.trim();
        if (!title || !value.value) { genSay("A Pepper needs a name and a value.", true); return; }
        if (list.some((o) => (o.title || "").toLowerCase() === title.toLowerCase())) { genSay("A Pepper with that name already exists.", true); return; }
        const uid = newUid();
        pepperAction(async () => { await commit((file, items) => putItem(file, items, uid, "PEPPER", { title, value: value.value })); g.pepperUid = uid; g.msg = 'Pepper "' + title + '" stored in your vault.'; g.msgError = false; });
      } }, "Store")),
      h("p", { class: "note" }, "Peppers are stored encrypted in your vault, like everything else, and are shared with the phone app."));
  })();

  const result = !g.password ? null : h("div", {},
    h("div", { class: "result" },
      h("span", { class: "mono", text: g.revealed ? g.password : detHint(g.password) || "" }),
      h("button", { class: "small", onclick: () => { g.revealed = !g.revealed; renderGenerator(); } }, g.revealed ? "Hide" : "Show")),
    g.checksOut == null ? null : h("p", { class: g.checksOut ? "ok" : "error", text: g.checksOut ? "Checks out!" : "Does not match the recipe's check (" + g.expectedSane + ")!" }),
    h("div", { class: "row2" },
      h("button", { onclick: () => copy("Password", g.password) }, "Copy PW"),
      h("button", { onclick: () => copy("Recipe", g.recipe) }, "Copy Recipe"),
      h("button", { onclick: () => downloadQr(g.recipe) }, "Download QR")),
    h("p", { class: "note" }, "The recipe and its QR code are as sensitive as the password itself unless you use a Pepper: anyone who has them can recreate it."));

  $("detail").replaceChildren(h("div", { class: "gen-view" },
    h("h2", { text: "Deterministic generator" }),
    h("p", { class: "muted", style: "margin:0 0 6px" }, "The same recipe always gives the same password, so it can be recreated instead of stored."),
    h("div", { class: "row2" },
      h("button", { onclick: async () => {
        try { const text = await navigator.clipboard.readText(); if (!text) genSay("The clipboard is empty.", true); else genApplyRecipe(text, "pasted"); }
        catch (e) { g.showPaste = true; renderGenerator(); }
      } }, "Paste recipe")),
    pasteArea,
    h("label", {}, "Base"), textInput("base"),
    h("label", {}, "Case (optional)"), textInput("kase"),
    h("label", {}, "Salt"), textInput("salt"),
    h("label", {}, "Pepper"), pepperSelect,
    h("div", { class: "row2" }, h("button", { class: "small", onclick: () => { g.managePeppers = !g.managePeppers; renderGenerator(); } }, g.managePeppers ? "Close Peppers" : "Manage Peppers")),
    pepperPanel,
    h("label", {}, "Type"), typeSelect,
    h("label", {}, "Trim (length, up to " + max + ")"), trim,
    h("div", { class: "row2" }, h("button", { class: "primary", disabled: g.busy, onclick: genGenerate }, g.busy ? "Generating…" : "Generate")),
    g.msg ? h("p", { class: g.msgError ? "error" : "muted", role: g.msgError ? "alert" : "status", text: g.msg }) : null,
    result));
}

// ---- QR code of a recipe ------------------------------------------------------------------
// The text is the recipe exactly as "Copy Recipe" produces it, which is what the
// phone app's "Scan QR" reads. Encoded as UTF-8 bytes, black on white, with the
// 4-module quiet zone the QR standard asks for.

function qrCanvas(text) {
  qrcode.stringToBytes = (s) => Array.from(enc.encode(s));
  const qr = qrcode(0, "M");
  qr.addData(text, "Byte");
  qr.make();
  const n = qr.getModuleCount(), quiet = 4;
  const scale = Math.max(6, Math.floor(1000 / (n + 2 * quiet)));
  const size = (n + 2 * quiet) * scale;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "#000";
  for (let row = 0; row < n; row++) for (let col = 0; col < n; col++) {
    if (qr.isDark(row, col)) ctx.fillRect((col + quiet) * scale, (row + quiet) * scale, scale, scale);
  }
  return canvas;
}

function downloadQr(text) {
  try {
    qrCanvas(text).toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = h("a", { href: url, download: "balrog-recipe-qr.png" });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      setStatus("QR code downloaded");
    }, "image/png");
  } catch (e) { setStatus("Could not make the QR code.", true); }
}

// ---- Wiring ---------------------------------------------------------------------------------

$("unlock").addEventListener("click", unlock);
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
$("lock").addEventListener("click", () => lock());
$("search").addEventListener("input", (e) => {
  view.query = e.target.value;
  clearBulk();
  if (view.type === "GENERATOR") { view.type = "PASSWORD"; render(); } else renderList();
});
$("newPassword").addEventListener("click", () => startNew("PASSWORD"));
$("newNote").addEventListener("click", () => startNew("NOTE"));
for (const type of ["pointerdown", "keydown", "wheel"]) document.addEventListener(type, touch, { passive: true });
window.addEventListener("focus", refresh);

try {
  const saved = localStorage.getItem("balrog.token");
  if (saved) { $("token").value = saved; $("remember").checked = true; $("password").focus(); }
} catch (e) { /* storage unavailable */ }
if (!window.isSecureContext) {
  $("loginError").textContent = "Open this page over https:// — browsers only allow encryption on secure pages.";
}
</script>
</body>
</html>
