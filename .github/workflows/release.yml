name: Release

# Push a tag like v1.1.0 to publish that commit's APK as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.BALROG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test
      - name: Use the release signing key, if one is configured
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/balrog.jks"
          echo "BALROG_KEYSTORE=$RUNNER_TEMP/balrog.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          BALROG_KEYSTORE_PASSWORD: ${{ secrets.BALROG_KEYSTORE_PASSWORD }}
          BALROG_KEY_ALIAS: ${{ secrets.BALROG_KEY_ALIAS }}
          BALROG_KEY_PASSWORD: ${{ secrets.BALROG_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "Balrog-$GITHUB_REF_NAME.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            signing="Signed with the project's release key; installs over earlier releases signed the same way."
          else
            signing="Signed with a one-off key: to move to or from this release, save a backup in Settings, uninstall, install, then restore."
          fi
          gh release create "$GITHUB_REF_NAME" "Balrog-$GITHUB_REF_NAME.apk" \
            --title "Balrog ${GITHUB_REF_NAME#v}" \
            --notes "Download **Balrog-$GITHUB_REF_NAME.apk** below and open it on your Android phone (Android 8.0 or newer). $signing"
