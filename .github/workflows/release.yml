name: Release

# Publishes the APK as a GitHub Release, once per version: whenever
# versionName in app/build.gradle.kts names a version that has no release
# yet, that commit is built, tagged v<versionName> and released.
on:
  push:
    branches: [main, 'ccr-**', 'claude/**']
    paths:
      - app/build.gradle.kts
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.BALROG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.version.outputs.needed
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.needed
      - name: Unit tests
        if: steps.version.outputs.needed
        run: ./gradlew test
      - name: Use the release signing key, if one is configured
        if: steps.version.outputs.needed && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/balrog.jks"
          echo "BALROG_KEYSTORE=$RUNNER_TEMP/balrog.jks" >> "$GITHUB_ENV"
      - name: Check the release signing key
        if: steps.version.outputs.needed && env.KEYSTORE_BASE64 != ''
        env:
          BALROG_KEYSTORE_PASSWORD: ${{ secrets.BALROG_KEYSTORE_PASSWORD }}
          BALROG_KEY_ALIAS: ${{ secrets.BALROG_KEY_ALIAS }}
          BALROG_KEY_PASSWORD: ${{ secrets.BALROG_KEY_PASSWORD }}
        run: |
          # Fail now, with a readable reason, rather than deep inside the build.
          for name in BALROG_KEYSTORE_PASSWORD BALROG_KEY_ALIAS BALROG_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is missing. All four BALROG_* signing secrets are needed (see README, Releases)."
              exit 1
            fi
          done
          if ! keytool -list -v -keystore "$BALROG_KEYSTORE" \
                 -storepass:env BALROG_KEYSTORE_PASSWORD -alias "$BALROG_KEY_ALIAS" > "$RUNNER_TEMP/key.txt" 2>&1; then
            echo "::error::The signing keystore could not be opened with the given alias and password. Re-check BALROG_KEYSTORE_BASE64, BALROG_KEYSTORE_PASSWORD and BALROG_KEY_ALIAS."
            exit 1
          fi
          # The fingerprint is public (it is inside every APK); handy for confirming
          # that two releases were signed by the same key.
          grep -E "Owner|Valid from|SHA256" "$RUNNER_TEMP/key.txt"
      - name: Build APK
        if: steps.version.outputs.needed
        env:
          BALROG_KEYSTORE_PASSWORD: ${{ secrets.BALROG_KEYSTORE_PASSWORD }}
          BALROG_KEY_ALIAS: ${{ secrets.BALROG_KEY_ALIAS }}
          BALROG_KEY_PASSWORD: ${{ secrets.BALROG_KEY_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "Balrog-$TAG.apk"
      - name: Publish release
        if: steps.version.outputs.needed
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            signing="Signed with the project's release key; installs over earlier releases signed the same way."
          else
            signing="Signed with a one-off key: to move to or from this release, save a backup in Settings, uninstall, install, then restore."
          fi
          notes="Download **Balrog-$TAG.apk** below and open it on your Android phone (Android 8.0 or newer). $signing"
          notes="$notes"$'\n\n'"For sync and the web version, also download **balrog-sync.php**, **balrog-config.sample.php** and **index.html**, and follow the README section *Sync and the web version*. Keep your own balrog-config.php when updating: releases never contain one."
          # Balrog.apk has a fixed name so that the web page's download button can
          # always point at ".../releases/latest/download/Balrog.apk".
          cp "Balrog-$TAG.apk" Balrog.apk
          gh release create "$TAG" "Balrog-$TAG.apk" Balrog.apk \
            server/balrog-sync.php server/balrog-config.sample.php server/index.html \
            --target "$GITHUB_SHA" \
            --title "Balrog ${TAG#v}" \
            --notes "$notes"
